name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths: ["space/**", ".github/scripts/deploy_hf.py"]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "huggingface_hub>=0.30"
      - name: Upload the Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: Zenaidiuno/shadowing-v2
        run: python .github/scripts/deploy_hf.py
