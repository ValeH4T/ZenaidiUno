name: Build and sign the iPhone Shortcut

on:
  push:
    branches: [main]
    paths: ["shortcut/**", ".github/workflows/sign-shortcut.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 shortcut/build_shortcut.py "/tmp/Shadowing 3.shortcut"
      - name: Sign (macOS "shortcuts sign")
        run: |
          set -x
          sw_vers
          shortcuts sign --mode anyone --input "/tmp/Shadowing 3.shortcut" --output "docs/Shadowing3.shortcut" 2>&1 | tee /tmp/sign.log || true
          if [ -s docs/Shadowing3.shortcut ]; then
            echo "::notice title=Shortcut signed::$(wc -c < docs/Shadowing3.shortcut) bytes, header $(head -c 4 docs/Shadowing3.shortcut)"
          else
            echo "::error title=Signing failed::$(tr '\n' ' ' < /tmp/sign.log | head -c 900)"
            exit 1
          fi
      - name: Commit the signed file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/Shadowing3.shortcut
          git commit -m "Signed Shortcut" || exit 0
          git push
