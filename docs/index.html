<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadowing</title>
<meta name="theme-color" content="#f8f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shadowing">
<link rel="apple-touch-icon" href="https://zenaidiuno-shadowing-v2.hf.space/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2306259d'/%3E%3Cpath d='M9 6.5v11l8.5-5.5z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f8f6f2; --card:#fff; --ink:#1f1d1a; --muted:#8c867e; --line:#ebe6df;
  --accent:#06259d; --accent-ink:#06207f; --accent-soft:#e4e8f6; --accent-line:#9ba8d8;
  --ok:#1e9e4a; --bad:#d93025;
  --btn:#efece8; --font:20px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}
.hidden{display:none!important}

/* ---------- home ---------- */
#home{max-width:680px;margin:0 auto;padding:calc(28px + var(--sat)) 18px calc(30px + var(--sab))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{margin:0;font-size:28px;letter-spacing:-.5px}
.tag{color:var(--muted);margin:2px 0 22px;font-size:15px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
  padding:0 14px;font-size:16px;direction:ltr;text-align:left;outline:none}
.inrow input:focus{border-color:var(--accent-line)}
.iconbtn{width:52px;height:52px;border-radius:14px;background:var(--btn);display:grid;place-items:center;flex:none}
.go{width:100%;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;margin-top:10px}
.go:active{filter:brightness(.92)}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fdecea;color:#8a2c1d;font-size:15px;line-height:1.5}
.libh{margin:30px 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.lib{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.item img{width:112px;height:63px;border-radius:9px;object-fit:cover;background:#ddd;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:600;line-height:1.35}
.item .t span{font-size:13px;color:var(--muted)}
.del{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.empty{color:var(--muted);font-size:14px;padding:8px 2px;line-height:1.6}
.hcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;line-height:1.7;font-size:15px}
.hcard p{margin:4px 0 10px;color:#4a463f}
.hcard .pill{display:inline-block;text-decoration:none}
.bm{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;direction:ltr;cursor:grab}

/* ---------- setup ---------- */
#setup{max-width:680px;margin:0 auto;padding:calc(10px + var(--sat)) 16px calc(40px + var(--sab))}
#setup .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#setup .top b{font-size:19px;flex:1;min-width:0;line-height:1.3}
#setup h4{margin:22px 0 6px;font-size:16px}
#setup .lead{line-height:1.8;font-size:15.5px;color:#3d3a35;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#setup ol{padding-inline-start:24px;line-height:1.9;font-size:15.5px;margin:6px 0}
#setup li{margin-bottom:12px}
.langsw{display:flex;gap:2px;margin-inline-start:auto;direction:ltr;background:var(--btn);border-radius:999px;padding:3px;flex:none}
.langsw button{min-width:38px;height:32px;padding:0 8px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.langsw button.sel{background:var(--accent);color:#fff}
.getsc{background:#fff;border:1.5px solid var(--accent-line);border-radius:14px;padding:14px 16px;margin-top:14px;line-height:1.7;font-size:15.5px}
.getsc p{margin:4px 0 12px;color:#4a463f}
.getsc .pill{display:inline-block;font-weight:600;font-size:16px;padding:12px 20px}
.copy{display:flex;gap:6px;align-items:center;margin:6px 0;direction:ltr}
.copy code{flex:1;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;word-break:break-all;line-height:1.4}
.copy button{flex:none;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px}

/* ---------- player ---------- */
#player{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:820px;margin:0 auto;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:calc(6px + var(--sat)) 10px 4px;flex:none}
header .mid{flex:1;min-width:0;text-align:center}
header .ttl{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
.hbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.hbtn.gear{background:var(--btn)}
.score{display:flex;align-items:center;gap:10px;padding:2px 16px 8px;flex:none;direction:ltr}
.score .num{font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:68px}
.score .num small{font-weight:600;color:var(--muted)}
.score .bar{flex:1;height:8px;border-radius:99px;background:#e6e2db;overflow:hidden}
.score .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s ease}
.score.full .bar i{background:var(--ok)}
.score.full .num{color:var(--ok)}
.vwrap{position:relative;width:min(100%, calc(40vh * 16 / 9));align-self:center;aspect-ratio:16/9;background:#000;flex:none}
.vwrap>div,.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ctrls{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);flex:none;direction:ltr}
.cb{width:54px;height:54px;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:transform .08s;flex:none}
.cb:active{transform:scale(.93)}
.cb.play{width:68px;height:68px;background:var(--accent);color:#fff}
.cb.loop,.cb.range{background:var(--accent-soft);color:var(--accent)}
.cb.loop.on,.cb.range.on{background:var(--accent);color:#fff}
.cb.range.pick{background:#fff;box-shadow:inset 0 0 0 2.5px var(--accent)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(40vh + var(--sab))}
.card{position:relative;background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:12px 16px 14px;margin-bottom:12px;
  box-shadow:0 1px 0 var(--line);cursor:pointer;overflow:hidden}
.card .row{display:flex;align-items:center;gap:8px;min-height:36px;direction:ltr}
.ts{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.reps{font-size:12px;font-weight:700;color:var(--accent);display:none}
.row .sp{flex:1}
.say,.mic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.say{background:var(--accent);color:#fff;display:none}
.mic{background:var(--accent-soft);color:var(--accent);transition:background .2s,color .2s}
.mic .ic-ok{display:none}
.mic.ok{background:var(--ok);color:#fff}
.mic.ok .ic-mic{display:none}
.mic.ok .ic-ok{display:block}
.mic.bad{background:var(--bad);color:#fff}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.45)}50%{box-shadow:0 0 0 9px rgba(217,48,37,0)}}
.txt{font-size:var(--font);line-height:1.45;margin-top:4px;font-weight:500}
.tr{font-size:calc(var(--font) * .8);line-height:1.6;color:#57524b;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tr:empty{display:none}
.heard{font-size:13.5px;line-height:1.5;margin-top:8px;padding:6px 10px;border-radius:10px;background:#f4f2ee;color:#57524b}
.heard:empty{display:none}
.heard.good{background:#e6f5ec;color:#16723a}
.heard.wrong{background:#fdecea;color:#a3261b}
.card.on{background:var(--accent-soft);border-color:var(--accent-line);box-shadow:none}
.card.on .txt{color:var(--accent-ink)}
.card.on .ts{color:var(--accent-ink)}
.card.on .say{display:grid}
.card.on .mic{background:#fff}
.card.on .mic.ok{background:var(--ok)}
.card.on .mic.bad,.card.on .mic.rec{background:var(--bad)}
.card.on .tr{border-color:#c9d1ee}
.card.inrange{border-inline-start:5px solid var(--accent)}
.card.pickA{box-shadow:inset 0 0 0 2.5px var(--accent)}
.loopmode .card.on .reps{display:block}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;opacity:0}
.card.on .prog{opacity:.75}
.card.wait .prog{background:#9ba8d8;opacity:1}
.waitnote{display:none;font-size:13px;color:var(--accent-ink);margin-top:8px}
.card.wait.tap .waitnote{display:block}
.state{padding:40px 20px;text-align:center;color:var(--muted);line-height:1.7}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.state .btns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:999px;background:var(--btn);font-size:15px;text-decoration:none;color:inherit}
.pill.primary{background:var(--accent);color:#fff}

/* ---------- settings sheet ---------- */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;
  max-height:82vh;overflow-y:auto;padding:10px 18px calc(22px + var(--sab));max-width:820px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:#d6d1ca;margin:0 auto 12px}
#sheet h3{margin:4px 0 14px;font-size:18px}
.sec{margin-bottom:16px}
.sec label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 13px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-size:15px;unicode-bidi:plaintext}
.seg button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
#sheet select{width:100%;height:44px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;padding:0 10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:#2a2724;color:#fff;
  padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center;line-height:1.5;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (min-width:900px){ #list{padding-bottom:30vh} }
</style>
</head>
<body>

<!-- =============== HOME =============== -->
<section id="home">
  <div class="brand">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
    <h1>Shadowing</h1>
    <div class="langsw" role="group" aria-label="Language"><button type="button" data-l="ar">AR</button><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div>
  </div>
  <p class="tag" data-t="tag"></p>

      <input id="url" type="url" inputmode="url" placeholder="https://youtu.be/..." aria-label="YouTube">
      <button type="button" class="iconbtn" id="paste" data-ta="paste">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      </button>
    </div>
    <button class="go" type="submit" data-t="start"></button>
  </form>
  <div id="homemsg" class="msg hidden"></div>
  <div class="libh" data-t="yourVideos"></div>
  <div id="lib" class="lib"></div>
  <div class="libh" data-t="howNew"></div>
  <div class="hcard">
    <b data-t="fromIphone"></b>
    <p data-t="iphoneHow"></p>
    <a class="pill primary" href="#setup" data-t="setupBtn"></a>

  <div class="hcard">

    <p data-t="bmHow"></p>
    <a class="bm" id="bm" href="#">▶ Shadowing</a>
  </div>
</section>

<!-- =============== SETUP (iPhone Shortcut) =============== -->
<section id="setup" class="hidden">
  <div class="top">
    <button class="hbtn" id="setupBack" data-ta="back"><svg class="flipx" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <b data-t="setupTitle"></b>
    <div class="langsw" role="group" aria-label="Language"><button type="button" data-l="ar">AR</button><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div>
  </div>

  <div id="quick" class="getsc hidden">
    <b data-t="quickTitle"></b>
    <p data-t="quickHow"></p>
    <a class="pill primary" id="getsc" href="#" data-t="quickBtn"></a>
  </div>
  <h4 id="buildH" data-t="buildTitle"></h4>
  <ol>
    <li data-t="s1"></li>
    <li><span data-t="s2"></span><div class="copy"><code data-c="req"></code><button type="button" data-t="copy"></button></div><span data-t="s2b"></span></li>
    <li><span data-t="s3"></span><div class="copy"><code data-c="yt"></code><button type="button" data-t="copy"></button></div><span data-t="s3b"></span></li>
    <li><span data-t="s4"></span><div class="copy"><code data-c="ingest"></code><button type="button" data-t="copy"></button></div><span data-t="s4b"></span></li>
    <li data-t="s5"></li>
    <li data-t="s6"></li>
  </ol>
  <h4 data-t="useTitle"></h4>
  <ol>
    <li data-t="u1"></li>
    <li data-t="u2"></li>
    <li data-t="u3"></li>
    <li data-t="u4"></li>
  </ol>
</section>

<!-- =============== PLAYER =============== -->
<section id="player" class="hidden">
  <header>
    <button class="hbtn" id="back" data-ta="back">
      <svg class="flipx" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="mid">
      <div class="ttl" id="ttl">Shadowing</div>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
    <button class="hbtn gear" id="gear" data-ta="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div class="score" id="score"><span class="num" id="scoreNum">0<small>/100</small></span><div class="bar"><i id="scoreBar"></i></div></div>
  <div class="vwrap" id="vwrap"></div>
  <div class="ctrls">
    <button class="cb" id="prev" data-ta="prev">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.5v13a.6.6 0 0 1-.93.5L8.6 12.5a.6.6 0 0 1 0-1L18.07 5a.6.6 0 0 1 .93.5z"/></svg>
    </button>
    <button class="cb play" id="play" data-ta="playPause">
      <svg id="icoPlay" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.7.7 0 0 0 1.06.6l10.9-6.8a.7.7 0 0 0 0-1.2L9.06 4.6A.7.7 0 0 0 8 5.2z"/></svg>
      <svg id="icoPause" class="hidden" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>

    </button>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4H4v16h3"/><path d="M17 4h3v16h-3"/><path d="M9 9h6M9 15h6"/></svg>
    </button>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5.5v13a.6.6 0 0 0 .93.5l9.47-6.5a.6.6 0 0 0 0-1L5.93 5a.6.6 0 0 0-.93.5z"/></svg>
    </button>
  </div>
  <div id="list"></div>
</section>

<!-- =============== SETTINGS =============== -->
<div id="sheetbg" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog">
  <div class="grab"></div>
  <h3 data-t="settings"></h3>
  <div class="sec"><label data-t="speed"></label><div class="seg" data-key="speed"></div></div>
  <div class="sec"><label data-t="reps"></label><div class="seg" data-key="reps"></div><div class="hint" data-t="repsHint"></div></div>

  <div class="sec"><label data-t="score"></label><div class="seg"><button type="button" id="resetScore" data-t="resetScore"></button></div></div>

    <select id="track"></select>
    <div class="seg" style="margin-top:10px"><button type="button" id="refetch" data-t="refetch"></button></div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ================= where the server is ================= */

function cleanCap(s){ return s.replace(/\n/g,' ').replace(/​/g,'').replace(/\[[^\]]*\]/g,' ').replace(/&gt;&gt;|>>/g,' ').replace(/\s+/g,' ').trim(); }

const FILLERS = /[,;]?\s*\b(e+h+|e+hm+|a+h+|o+h+|u+h+|u+hm+|m+h+|beh|mah|ahah\w*)\b(?=[\s,.!?;:…]|$)/gi;

    .replace(/\s+([,.!?;:])/g, '$1').replace(/,(\s*[.!?])/g, '$1').replace(/\s{2,}/g, ' ').trim();

  const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl || 'auto')}&tl=${encodeURIComponent(tl)}&dt=t`,
    {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'q=' + encodeURIComponent(text)});

  const out = new Array(lines.length).fill(null); const chunks = []; let cur = [], size = 0;
  lines.forEach((l, i) => { const n = l.length + 1; if (cur.length && size + n > 3500){ chunks.push(cur); cur = []; size = 0; } cur.push(i); size += n; });
  if (cur.length) chunks.push(cur);

    let res = [];

    const bad = out.map((x, i) => [i, x]).filter(([, x]) => x && dscore(x)).map(([i]) => i);

/* ================= sentence list ================= */
const MIC_SVG = '<svg class="ic-mic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>'
  + '<svg class="ic-ok" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function currentTr(){ const l = trLang(); if (l === 'off' || !st.data) return null; return (st.data.tr || {})[l] || null; }
function renderList(){
  const tr = currentTr(), done = new Set(st.data.done || []), trDir = RTL_LANGS.has(trLang()) ? 'rtl' : 'ltr';
  $('#list').innerHTML = st.S.map((s, i) => `
    <div class="card" data-i="${i}">
      <div class="row"><span class="ts">${fmt(s.start)}</span><span class="reps"></span><span class="sp"></span>
        <button class="say" data-say="${i}" aria-label="${esc(t('sayBtn'))}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="mic${done.has(i) ? ' ok' : ''}" data-mic="${i}" aria-label="${esc(t('micBtn'))}">${MIC_SVG}</button></div>
      <div class="txt" dir="auto">${esc(s.text)}</div>
      <div class="tr" dir="${trDir}">${tr && tr[i] ? esc(tr[i]) : ''}</div>
      <div class="heard" dir="auto"></div>
      <div class="waitnote">${esc(t('tapContinue'))}</div>
      <div class="prog"></div>
    </div>`).join('');
  st.cards = Array.from(document.querySelectorAll('#list .card'));
  markRange();
}
$('#list').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const i = +card.dataset.i;
  if (e.target.closest('[data-mic]')){ startMic(i); return; }
  if (st.pick){ pickRange(i); return; }
  const say = e.target.closest('[data-say]');
  if (!say && st.pending && i === st.idx && $('#list .card.wait.tap')) { runPending(); return; }
  if (st.range && (i < st.range.a || i > st.range.b)) clearRange(true);
  clearPending(); st.reps = 0; setIdx(i); seekPlay(i);
});
['touchstart','wheel','mousedown'].forEach(ev => $('#list').addEventListener(ev, () => { st.userScrollAt = Date.now(); }, {passive:true}));
function setIdx(i, o={}){
  if (!st.S.length) return;
  i = Math.max(0, Math.min(st.S.length-1, i));
  const prev = st.cards[st.idx]; if (prev){ prev.classList.remove('on','wait','tap'); const p = prev.querySelector('.prog'); p.style.transition='none'; p.style.width='0'; }
  st.idx = i;
  const c = st.cards[i]; if (!c) return;
  c.classList.add('on'); updateReps();
  if (o.scroll || Date.now() - st.userScrollAt > 2500) c.scrollIntoView({block: o.instant ? 'start' : 'center', behavior: o.instant ? 'auto' : 'smooth'});
  saveSoon();
}
function updateReps(){
  document.body.classList.toggle('loopmode', !!(settings.loop || st.range));
  const c = st.cards[st.idx]; if (!c) return;
  c.querySelector('.reps').textContent = '↻ ' + (st.reps + 1) + (settings.reps ? ' / ' + settings.reps : '');
}
function findIdx(x){ const S = st.S; let lo = 0, hi = S.length - 1, ans = S.length - 1;
  while (lo <= hi){ const m = (lo+hi) >> 1; if (S[m].end > x){ ans = m; hi = m - 1; } else lo = m + 1; } return ans; }

/* ================= repeat a group of sentences ================= */
function markRange(){
  st.cards.forEach((c, i) => {
    c.classList.toggle('inrange', !!st.range && i >= st.range.a && i <= st.range.b);
    c.classList.toggle('pickA', st.pick && st.pickA === i);
  });
  $('#range').classList.toggle('on', !!st.range); $('#range').classList.toggle('pick', st.pick);
  updateReps();
}
function clearRange(silent){ st.range = null; st.pick = false; st.pickA = null; markRange(); if (!silent) toast(t('rangeOff'), 1600); }
function pickRange(i){
  if (st.pickA == null){ st.pickA = i; markRange(); toast(t('pickLast'), 2500); return; }
  const a = Math.min(st.pickA, i), b = Math.max(st.pickA, i);
  st.pick = false; st.pickA = null; st.range = {a, b}; st.reps = 0; markRange();
  toast(t('rangeOn', {a: a + 1, b: b + 1}), 2200);
  clearPending(); setIdx(a, {scroll:true}); seekPlay(a);
}
$('#range').addEventListener('click', () => {
  if (st.range || st.pick){ clearRange(); return; }
  if (!st.S.length) return;
  st.pick = true; st.pickA = null; pauseVideo(); markRange(); toast(t('pickFirst'), 2500);
});

/* ================= playback engine ================= */
function seekPlay(i){
  if (!st.ready || !st.S[i]) return;
  const target = Math.max(0, st.S[i].start - 0.12);
  try { st.player.seekTo(target, true); st.player.playVideo(); } catch(e){}
  st.seekTarget = target; st.seekAt = performance.now(); st.seekDeadline = st.seekAt + 1600;
  hintIfStuck();
}
function hintIfStuck(){
  if (st.hinted) return;
  setTimeout(() => { if (!st.player || st.pending || isPlaying() || st.hinted || st.rec) return; st.hinted = true; toast(t('iosTap'), 5000); }, 2200);
}
function clearPending(){ clearTimeout(st.gapTimer); st.gapTimer = null; st.pending = null; const c = st.cards[st.idx]; if (c) c.classList.remove('wait','tap'); }
function runPending(){ const f = st.pending; clearPending(); if (f) f(); }
function afterGap(fn, from){
  const S = st.S; let ms = 0;
  if (settings.gap === 'tap') ms = Infinity;
  else if (settings.gap === 'len'){ const a = S[from != null ? from : st.idx]; ms = (S[st.idx].end - a.start) * 1000 / (settings.speed || 1) + 400; }
  else ms = (+settings.gap || 0) * 1000;
  if (!ms){ fn(); return; }
  pauseVideo(); st.pending = fn;
  const c = st.cards[st.idx];
  if (c){
    c.classList.add('wait'); c.classList.toggle('tap', ms === Infinity);
    const p = c.querySelector('.prog');
    if (ms !== Infinity){ p.style.transition = 'none'; p.style.width = '100%'; void p.offsetWidth; p.style.transition = `width ${ms}ms linear`; p.style.width = '0'; }
  }
  if (ms !== Infinity) st.gapTimer = setTimeout(runPending, ms);
}
function onEnd(){
  const S = st.S, i = st.idx;
  if (st.range){
    const {a, b} = st.range;
    if (i < b){ setIdx(i + 1); return; }            // keep going through the group
    st.reps++;
    if (settings.reps && st.reps >= settings.reps){ st.reps = 0; clearRange(true); if (i < S.length - 1) afterGap(() => { setIdx(i + 1); seekPlay(i + 1); }); else pauseVideo(); return; }
    updateReps(); afterGap(() => { setIdx(a); seekPlay(a); }, a); return;
  }
  if (settings.loop){
    st.reps++;
    if (settings.reps && st.reps >= settings.reps){
      st.reps = 0;
      if (i >= S.length - 1){ pauseVideo(); updateReps(); return; }
      afterGap(() => { setIdx(i + 1); seekPlay(i + 1); });
    } else { updateReps(); afterGap(() => seekPlay(i)); }
  } else {
    if (i >= S.length - 1) return;
    if (settings.gap !== '0') afterGap(() => { setIdx(i + 1); seekPlay(i + 1); });
    else setIdx(i + 1);
  }
}
function tick(){
  if (!st.ready || !st.player || !st.S.length || !st.player.getPlayerState) return;
  let ps, x;
  try { ps = st.player.getPlayerState(); x = st.player.getCurrentTime(); } catch(e){ return; }
  const s = st.S[st.idx], c = st.cards[st.idx];
  if (c && !st.pending){
    const pct = Math.max(0, Math.min(1, (x - s.start) / Math.max(0.2, s.end - s.start)));
    const p = c.querySelector('.prog'); p.style.transition = 'none'; p.style.width = (pct*100).toFixed(1) + '%';
  }
  if (ps !== 1 || st.pending || st.rec) return;
  if (st.seekTarget != null){
    const settled = performance.now() - st.seekAt > 250 && Math.abs(x - st.seekTarget) < 0.9;
    if (settled || performance.now() > st.seekDeadline) st.seekTarget = null; else return;
  }
  if (x < s.start - 0.7 || x > s.end + 0.7){ const j = findIdx(x); if (j !== st.idx){ st.reps = 0; setIdx(j); return; } }
  if (x >= s.end - 0.04) onEnd();
}
setInterval(tick, 50);
function togglePlay(){
  if (!st.player || !st.ready) return;
  if (st.pending){ runPending(); return; }
  if (isPlaying()){ pauseVideo(); return; }
  const x = st.player.getCurrentTime(), s = st.S[st.idx];
  if (s && (x < s.start - 0.7 || x >= s.end - 0.05)) seekPlay(st.idx); else { st.player.playVideo(); hintIfStuck(); }
}
function jump(d){
  if (!st.S.length) return; clearPending(); st.reps = 0;
  const i = Math.max(0, Math.min(st.S.length-1, st.idx + d));
  if (st.range && (i < st.range.a || i > st.range.b)) clearRange(true);
  setIdx(i, {scroll:true}); seekPlay(i);
}
function setLoopBtn(){ $('#loop').classList.toggle('on', !!settings.loop); updateReps(); }
$('#play').addEventListener('click', togglePlay);
$('#prev').addEventListener('click', () => jump(-1));
$('#next').addEventListener('click', () => jump(1));
$('#loop').addEventListener('click', () => { settings.loop = !settings.loop; saveSettings(); st.reps = 0; setLoopBtn(); toast(settings.loop ? t('loopOn') : t('loopOff'), 1600); });
document.addEventListener('keydown', e => {
  if ($('#player').classList.contains('hidden') || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); jump(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); jump(-1); }
  else if (e.key === 'r' || e.key === 'R'){ $('#loop').click(); }
  else if (e.key === 'm' || e.key === 'M'){ startMic(st.idx); }
});

/* ================= microphone: say the sentence ================= */
function micBtn(i){ return st.cards[i] && st.cards[i].querySelector('.mic'); }
function stopMic(){ if (st.rec){ const r = st.rec; st.rec = null; clearTimeout(st.recTimer); clearTimeout(st.silTimer); try{ r.abort(); }catch(e){} const b = micBtn(st.recIdx); if (b) b.classList.remove('rec'); st.recIdx = -1; } }
function startMic(i, attempt = 0){
  if (!SR){ toast(t('micNo'), 4500); return; }
  if (st.rec){ // tapping the same mic again finishes listening; another sentence's mic switches to it
    if (st.recIdx === i && !attempt){ try{ st.rec.stop(); }catch(e){} return; }
    stopMic();
  }
  clearPending(); pauseVideo();
  if (i !== st.idx) setIdx(i);
  const card = st.cards[i], btn = micBtn(i), heard = card.querySelector('.heard'), s = st.S[i];
  const r = new SR();
  r.lang = SR_LOCALE[base(st.data.language_code)] || base(st.data.language_code) || 'it-IT';
  // continuous: the iPhone otherwise gives up after a short silence; we stop it ourselves
  r.interimResults = true; r.continuous = true; r.maxAlternatives = 5;
  let cands = [], live = '', failed = '', gotSpeech = false;
  btn.classList.remove('bad'); btn.classList.add('rec');
  heard.className = 'heard'; heard.textContent = '🎙 …';
  const finishIn = ms => { clearTimeout(st.silTimer); st.silTimer = setTimeout(() => { try{ r.stop(); }catch(e){} }, ms); };
  r.onstart = () => { if (st.rec === r && !gotSpeech) heard.textContent = '🎙 ' + t('speakNow'); };
  r.onresult = e => {
    gotSpeech = true;
    const res = Array.from(e.results);
    live = res.map(x => x[0].transcript).join(' ').trim();
    heard.textContent = '🎙 ' + live;
    const maxAlt = Math.max(...res.map(x => x.length));
    cands = Array.from({length: maxAlt}, (_, a) => res.map(x => x[Math.min(a, x.length - 1)].transcript).join(' '));
    // stop as soon as the whole sentence was heard, otherwise after a short silence
    finishIn(similarity(s.text, live) >= 0.999 ? 300 : (res[res.length - 1].isFinal ? 1300 : 2200));
  };
  r.onerror = e => { failed = e.error || 'error'; };
  r.onend = () => {
    clearTimeout(st.recTimer); clearTimeout(st.silTimer);
    if (st.rec !== r) return;
    st.rec = null; st.recIdx = -1; btn.classList.remove('rec');
    if (failed === 'not-allowed' || failed === 'service-not-allowed'){ heard.className = 'heard wrong'; heard.textContent = t('micDenied'); return; }
    if (!gotSpeech){
      // the iPhone sometimes refuses to record while the video's sound is still on: try once more after it stops
      if (attempt < 1 && failed !== 'no-speech'){ heard.textContent = '🎙 …'; setTimeout(() => { if (!st.rec) startMic(i, attempt + 1); }, 600); return; }
      heard.className = 'heard wrong';
      heard.textContent = failed && failed !== 'no-speech' ? t('micErr', {e: failed}) : t('micNothing');
      return;
    }
    let best = '', score = -1;
    for (const c of (cands.length ? cands : [live])){ const sc = similarity(s.text, c); if (sc > score){ score = sc; best = c; } }
    const okNow = score >= PASS, pct = Math.round(score * 100);
    heard.className = 'heard ' + (okNow ? 'good' : 'wrong');
    heard.textContent = `${okNow ? '✓' : '✗'} ${t('heard')}: ${best} (${pct}%)`;
    if (okNow){
      btn.classList.add('ok');
      const done = new Set(st.data.done || []); const before = scoreOf(st.data); done.add(i); st.data.done = [...done];
      updateScore(); saveSoon();
      if (scoreOf(st.data) >= 100 && before < 100) toast(t('full'), 6000);
    } else {
      const wasOk = btn.classList.contains('ok');
      btn.classList.remove('ok'); btn.classList.add('bad');
      setTimeout(() => { btn.classList.remove('bad'); if (wasOk) btn.classList.add('ok'); }, 1600);
    }
  };
  st.rec = r; st.recIdx = i;
  try { r.start(); }
  catch(e){
    st.rec = null; st.recIdx = -1; btn.classList.remove('rec');
    if (attempt < 1){ setTimeout(() => startMic(i, attempt + 1), 600); return; }
    heard.className = 'heard wrong'; heard.textContent = t('micErr', {e: e.name || 'start'}); return;
  }
  st.recTimer = setTimeout(() => { try{ r.stop(); }catch(e){} }, Math.min(20000, (s.end - s.start) * 2000 + 6000));
}

/* ================= translation into the page ================= */
async function ensureTranslations(){
  const lang = trLang(), S = st.S;
  const trDir = RTL_LANGS.has(lang) ? 'rtl' : 'ltr';
  document.querySelectorAll('#list .tr').forEach((el, i) => { const tr = currentTr(); el.dir = trDir; el.textContent = tr && tr[i] ? tr[i] : ''; });
  if (lang === 'off' || !S.length || base(st.data.language_code) === lang) return;
  const arr = st.data.tr[lang] = st.data.tr[lang] || new Array(S.length).fill(null);
  const token = ++st.trToken, vid = st.vid, CH = 40;
  const starts = []; const first = Math.floor(st.idx / CH) * CH;
  for (let a = first; a < S.length; a += CH) starts.push(a);
  for (let a = 0; a < first; a += CH) starts.push(a);
  let failed = 0;
  for (const a of starts){
    const idxs = []; for (let i = a; i < Math.min(S.length, a + CH); i++) if (!arr[i]) idxs.push(i);
    if (!idxs.length) continue;
    let res = [];
    try { res = await translateLines(idxs.map(i => S[i].text), base(st.data.language_code), lang); } catch(e){}
    if (token !== st.trToken || vid !== st.vid) return;
    idxs.forEach((i, k) => { if (res[k]){ arr[i] = res[k]; const el = st.cards[i] && st.cards[i].querySelector('.tr'); if (el) el.textContent = res[k]; } else failed++; });
  }
  if (failed) toast(t('trFail'), 3500);
  saveSoon();
}

/* ================= settings sheet ================= */
function buildSheet(){
  const O = OPTIONS();
  document.querySelectorAll('#sheet .seg[data-key]').forEach(seg => {
    const key = seg.dataset.key, cur = key === 'tr' ? trLang() : settings[key];
    seg.innerHTML = O[key].map(([v, l]) => `<button type="button" data-v="${v}" class="${String(cur) === String(v) ? 'sel' : ''}">${esc(l)}</button>`).join('');
  });
  const d = st.data || {}, tracks = d.tracks || [], sel = $('#track');
  sel.innerHTML = tracks.map(x => `<option value="${esc(x.code)}" ${base(x.code) === base(d.language_code) ? 'selected' : ''}>${esc(x.name || x.code)}</option>`).join('');
  sel.classList.toggle('hidden', tracks.length < 2);
}
function applyFont(){ document.documentElement.style.setProperty('--font', FONT[settings.font] || '20px'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#sheetbg').classList.add('hidden'); }
$('#gear').addEventListener('click', () => { buildSheet(); $('#sheet').classList.remove('hidden'); $('#sheetbg').classList.remove('hidden'); });
$('#sheetbg').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('.seg[data-key] button'); if (!b) return;
  const key = b.parentElement.dataset.key; let v = b.dataset.v;
  if (key === 'speed' || key === 'reps') v = +v;
  settings[key] = v; saveSettings();
  if (key === 'speed' && st.player) try{ st.player.setPlaybackRate(v); }catch(e){}
  if (key === 'font') applyFont();
  if (key === 'reps'){ st.reps = 0; updateReps(); }
  if (key === 'tr' && st.data){ renderList(); setIdx(st.idx); ensureTranslations(); }
  if (key === 'gap' && st.pending && v === '0') runPending();
  if (key === 'ui'){ applyLang(); if (st.data && st.S.length){ setHeader(); renderList(); setIdx(st.idx); ensureTranslations(); } else renderLib(); }
  buildSheet();
});
$('#resetScore').addEventListener('click', () => { if (!st.data) return; st.data.done = []; st.cards.forEach(c => { c.querySelector('.mic').classList.remove('ok'); c.querySelector('.heard').textContent = ''; }); updateScore(); saveSoon(); toast(t('scoreReset'), 1500); });
$('#track').addEventListener('change', e => { closeSheet(); openVideo(st.vid, {fresh:true, lang:e.target.value}); });
$('#refetch').addEventListener('click', () => { const v = st.vid; closeSheet(); if (v) openVideo(v, {fresh:true, lang: st.data && st.data.language_code}); });

/* ================= start ================= */
applyLang(); applyFont(); setLoopBtn();
document.addEventListener('visibilitychange', () => { if (document.hidden){ saveVideo(); stopMic(); } });
window.addEventListener('pagehide', saveVideo);
(function boot(){
  const q = new URLSearchParams(location.search);
  const v = vidFrom(q.get('v') || q.get('url') || '');
  if (v && !location.hash) history.replaceState(null, '', location.pathname + '#v=' + v);
  route();
})();
// exposed for tests only
window.__shadow = {splitSentences, json3ToCues, resplit, similarity, stripFillers, dscore, scoreOf};
})();
</script>
